async function refreshTcgCatalog(){if(tcgChecked)return;tcgChecked=true;try{const c=JSON.parse(localStorage.getItem(tcgCacheKey));if(validCatalog(c?.data)&&Date.now()-c.checkedAt<7*86400000)return;}catch{}try{const r=await fetch('tcg-list.json?check='+Date.now(),{cache:'no-store'});if(!r.ok)return;const d=await r.json();if(!validCatalog(d))return;tcgCatalog=d;try{localStorage.setItem(tcgCacheKey,JSON.stringify({data:d,checkedAt:Date.now()}))}catch{}const el=$('#unexplored-text');if(el)el.textContent=unexploredText();}catch{}}

function trioKey(c){return JSON.stringify(['tcg','ref'].map(k=>norm(c[k])))}
function trioRefParts(ref){const m=norm(ref).match(/^([a-z]+)\s+(\d+\s*\/\s*\d+)$/i);return m?{prefix:m[1],number:m[2].replace(/\s/g,'')}:null}
function trioPrefixClose(a,b){if(a===b)return true;if(Math.abs(a.length-b.length)>1)return false;let i=0,j=0,d=0;while(i<a.length&&j<b.length){if(a[i]===b[j]){i++;j++;continue}if(++d>1)return false;if(a.length>b.length)i++;else if(b.length>a.length)j++;else{i++;j++}}return d+(a.length-i)+(b.length-j)<=1}
function matchesTrioGroup(group,c){
  if(norm(group[0].tcg)!==norm(c.tcg))return false;
  if(trioKey(group[0])===trioKey(c))return true;
  const ref=trioRefParts(c.ref);
  return !!ref&&group.every(card=>{
    const other=trioRefParts(card.ref);
    return other&&ref.number===other.number&&trioPrefixClose(ref.prefix,other.prefix);
  });
}
function trioGroups(C,minimum=3){const groups=[];for(const c of C){if(!norm(c.tcg)||!norm(c.ref))continue;const group=groups.find(g=>matchesTrioGroup(g,c));if(group)group.push(c);else groups.push([c])}return groups.filter(g=>g.length>=minimum)}
function cardMatchHint(card){
  if(!['tcg','ref','lang'].every(key=>norm(card[key])))return null;
  const exact=norm(card.type)&&norm(card.set)&&duplicate(card);
  if(exact){
    const {binder,page,slot}=memoryLocation(state.cards.indexOf(exact)+1);
    return {kind:'duplicate',message:'Cette version est déjà dans le Binder',detail:`Classeur ${binder} · page ${page} · emplacement ${slot}`};
  }
  const versions=state.cards.filter(other=>other.id!==card.id&&matchesTrioGroup([other],card));
  if(!versions.length)return null;
  const count=versions.length===1?'1 version déjà dans le Binder':`${versions.length} versions déjà dans le Binder`;
  const message=norm(card.type)&&norm(card.set)?'Nouvelle variante · '+count:count;
  const detail=[...new Set(versions.map(other=>[other.lang,other.type].filter(Boolean).join(' · ')).filter(Boolean))].join(' / ');
  return {kind:'related',message,detail};
}
function bindCardMatchHint(editedCard){

}

}

function illustratorCuriosities(cards,add){

function trioDisplayRefs(group){const refs=[...new Set(group.map(c=>String(c.ref||'').trim()).filter(Boolean))];if(refs.length<=1)return refs[0]||'';const parts=refs.map(trioRefParts);if(parts.every(Boolean)&&parts.every(p=>p.number===parts[0].number)){const prefixes=[...new Set(parts.map(p=>p.prefix.toUpperCase()))];return prefixes.join('/')+' '+parts[0].number}return refs.join(' · ')}

function constellationLayout(cards){const counts=new Map();for(const c of cards)if(c.tcg)counts.set(c.tcg,(counts.get(c.tcg)||0)+1);const rows=[...counts].sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0],'fr'));const w=320,h=Math.max(440,Math.ceil(rows.length/4)*90+80),max=rows[0]?.[1]||1,stars=[];for(const [name,n] of rows){const r=7+15*Math.sqrt(n/max);let x,y;for(let j=0;j<3000;j++){x=35+Math.random()*250;y=35+Math.random()*(h-70);if(stars.every(p=>Math.hypot(p.x-x,p.y-y)>Math.max(44,p.r+r+12)))break;}stars.push({name,n,x,y,r});}return {w,h,stars};}

function celestialStar(s,i){const r=s.r;return `<g transform="translate(${s.x} ${s.y})"><circle class="constellation-hit" r="${Math.max(22,r+7)}" fill="transparent" stroke="transparent"/><g class="sky-shine" style="animation-delay:${i*.07}s" pointer-events="none"><circle r="${r*1.8}" fill="url(#sky-glow)"/><circle r="${r*1.15}" fill="none" stroke="#e7c986" stroke-width=".7" stroke-dasharray=".7 3.5" opacity=".85"/>${Array.from({length:8},(_,j)=>`<path transform="rotate(${j*45})" d="M0 ${-r*(j%2?.65:1)} L${r*.10} ${-r*.15} L0 0 L${-r*.10} ${-r*.15}Z" fill="${j%2?'#d8b16d':'#fff0c4'}" stroke="#f5d99c" stroke-width=".35"/>`).join('')}<circle r="${r*.15}" fill="#fff"/><circle r="${r*.34}" fill="url(#sky-glow)"/></g></g>`;}
function renderSky(){if(!skyLayout)skyLayout=constellationLayout(state.cards);const {w,h,stars}=skyLayout;const selected=stars.find(s=>s.name===constellationSelected);const dust=Array.from({length:180},(_,i)=>`<circle cx="${(i*73.17+13)%w}" cy="${(i*137.13+17)%h}" r="${i%13===0?1:.45}" fill="#d8d9ee" opacity="${.15+(i%7)*.08}"/>`).join('');const links=[];if(stars.length){const used=new Set([0]);while(used.size<stars.length){let best=[0,0,Infinity];for(const i of used)for(let j=0;j<stars.length;j++)if(!used.has(j)){const d=Math.hypot(stars[i].x-stars[j].x,stars[i].y-stars[j].y);if(d<best[2])best=[i,j,d];}used.add(best[1]);links.push(best);}}$('#view').innerHTML=`<button id="sky-back">‹ Statistiques</button><div class="sky-heading"><small>EXPÉDITION 33</small><h2>Le Ciel de l’Expédition</h2><small>${stars.length} ${(stars.length)===1?'monde':'mondes'} · Une seule aventure</small></div><div class="constellation-sky sky-full"><svg viewBox="0 0 ${w} ${h}" role="group" aria-label="Carte céleste des TCG"><defs><radialGradient id="sky-glow"><stop stop-color="#fff3c6" stop-opacity=".75"/><stop offset=".35" stop-color="#e7b65a" stop-opacity=".24"/><stop offset="1" stop-color="#e7b65a" stop-opacity="0"/></radialGradient><radialGradient id="sky-neb"><stop stop-color="#594b82" stop-opacity=".55"/><stop offset="1" stop-color="#17152c" stop-opacity="0"/></radialGradient></defs><ellipse cx="90" cy="${h*.32}" rx="190" ry="${h*.35}" fill="url(#sky-neb)"/><ellipse cx="260" cy="${h*.7}" rx="150" ry="${h*.35}" fill="url(#sky-neb)"/>${dust}<g class="sky-links" stroke="#d1b77b" stroke-width=".65" opacity=".45">${links.map(([i,j])=>`<path d="M${stars[i].x} ${stars[i].y}L${stars[j].x} ${stars[j].y}"/>`).join('')}</g>${stars.map((s,i)=>`<g class="constellation-node" data-star="${esc(s.name)}" role="button" tabindex="0" aria-label="${esc(s.name)} : ${s.n} ${(s.n)===1?'carte':'cartes'}" aria-pressed="${s.name===constellationSelected}">${celestialStar(s,i)}</g>`).join('')}</svg></div><div class // Reflets : une identité dans plusieurs références du même TCG, ou plusieurs univers.
function refletKey(value){return String(value||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim().replace(/\s+/g,' ').toLocaleLowerCase('fr');}
function refletGroups(cards){
 const names=new Map();
 for(const card of cards){const name=refletKey(card.name),tcg=refletKey(card.tcg),ref=refletKey(card.ref);if(!name||!tcg||!ref)continue;
 if(!names.has(name))names.set(name,[]);names.get(name).push(card);}
 const ordinary=[],multiverse=[];
 for(const group of names.values()){
  const byTcg=new Map();
  for(const card of group){const k=refletKey(card.tcg);if(!byTcg.has(k))byTcg.set(k,[]);byTcg.get(k).push(card);}
  for(const tcgCards of byTcg.values()){
   const distinct=[];
   for(const card of tcgCards){const existing=distinct.find(g=>matchesTrioGroup(g,card));if(existing)existing.push(card);else distinct.push([card]);}
   if(distinct.length>=2)ordinary.push(distinct.map(g=>g[0]));
  }
  if(byTcg.size>=2)multiverse.push([...byTcg.values()].flatMap(g=>g));
 }
 return {ordinary,multiverse};
}
function refletStats(){
 const {ordinary,multiverse}=refletGroups(state.cards),total=ordinary.reduce((n,g)=>n+g.length,0);
 const list=(groups,label)=>groups.slice().sort((a,b)=>b.length-a.length||a[0].name.localeCompare(b[0].name,'fr')).map(g=>{
  const positions=g.map(c=>state.cards.indexOf(c)+1).filter(p=>p>0).sort((a,b)=>a-b).map(p=>{const l=memoryLocation(p);return l.binder+'.'+l.page+'.'+l.slot;});
  const tcgs=[...new Set(g.map(c=>c.tcg))].join(' · ');
  const refs=[...new Set(g.map(c=>c.ref))].join(' · ');
  return '<div class="stat-link trio-row trio-layout"><span class="trio-name">'+esc(g[0].name)+'</span><span class="trio-count">'+g.length+' cartes</span><small class="trio-meta">'+esc(tcgs)+' · '+esc(refs)+'</small><span class="trio-positions">'+positions.map(p=>'<span>'+esc(p)+'</span>').join('')+'</span></div>';
 }).join('')||'<small>Aucun '+label+' découvert pour le moment.</small>';
 return statFold('reflets','Les Reflets de l’Expédition',ordinary.length+' groupes · '+multiverse.length+' multiversels',
 '<div class="stat-kpis"><div><strong>'+ordinary.length+'</strong><small>Reflets</small></div><div><strong>'+total+'</strong><small>Cartes reflétées</small></div><div><strong>'+multiverse.length+'</strong><small>Multiversels</small></div></div><h4>Reflets</h4>'+list(ordinary,'Reflet')+'<h4>Reflets Multiversels</h4>'+list(multiverse,'Reflet Multiversel'));
}

function reconcileJournal(entries,cards){const ids=new Map(cards.map(c=>[String(c.id),c]));const fields=['name','ref','tcg','set','lang','type'];let removed=0,repaired=0,uncertain=0;const cleaned=entries.map(e=>{if(e.kind!=='acquisitions')return e;return {...e,cards:(e.cards||[]).flatMap(c=>{if(c.id!=null&&ids.has(String(c.id)))return [{...c,id:ids.get(String(c.id)).id}];if(c.id!=null){removed++;return []}const matches=cards.filter(x=>fields.every(k=>norm(x[k]||'')===norm(c[k]||'')));if(matches.length===1){repaired++;return [{...c,id:matches[0].id}]}uncertain++;return [c]})}}).filter(e=>e.kind!=='acquisitions'||e.cards.length||e.note);return {cleaned,removed,repaired,uncertain}}
function auditAchievements(){const old=state.journal.entries;const {cleaned,removed,repaired,uncertain}=reconcileJournal(old,state.cards);let valid;try{state.journal.entries=cleaned;valid=achievements.filter((a,i)=>achievementChecks[i](state.cards)>=a.goal)}finally{state.journal.entries=old}const set=new Set(valid.map(a=>a.id)),lost=achievements.filter(a=>state.achievements.includes(a.id)&&!set.has(a.id)),titles=lost.filter(a=>Object.prototype.hasOwnProperty.call(collectorTitles,a.id));const d=document.createElement('dialog');d.innerHTML=`<h2>Vérification des accomplissements</h2><p>Accomplissements valides : ${valid.length}</p><p>Accomplissements à reverrouiller : ${lost.length}</p><p>Titres concernés : ${titles.length}</p><p>Acquisitions supprimées à retirer du journal : ${removed}</p><p>Anciennes acquisitions à relier : ${repaired}</p><p>Acquisitions incertaines conservées : ${uncertain}</p><p class="muted">Les cartes ne seront pas modifiées. Les acquisitions identifiées de cartes absentes seront retirées du journal. Les anciennes entrées sans identifiant seront reliées si la correspondance est unique, sinon conservées. Les souvenirs scellés restent inchangés.</p><div class="row"><button id="auditCancel">Annuler</button><button id="auditApply" style="background:#15803d;color:white">Appliquer</button></div>`;document.body.append(d);d.addEventListener('close',()=>d.remove());d.querySelector('#auditCancel').onclick=()=>d.close();d.querySelector('#auditApply').onclick=()=>{const names=new Set(lost.map(a=>a.name));state.journal.entries=cleaned.filter(e=>e.kind!=='achievement'||!names.has(e.name));state.achievements=valid.map(a=>a.id);if(!set.has(state.collectorTitle))state.collectorTitle='';achievementQueue=achievementQueue.filter(a=>set.has(a.id));save();d.close();render()};d.showModal()}
function checkAchievements(){const C=state.cards;state.achievements=Array.isArray(state.achievements)?state.achievements:[];let fresh=[];achievements.forEach((a,i)=>{if(!state.achievements.includes(a.id)&&achievementChecks[i](C)>=a.goal){state.achievements.push(a.id);fresh.push(a)}});if(fresh.length){if(state.journal)fresh.forEach(a=>journalAdd("achievement",{name:a.name,secret:a.secret,t:a.t}));save();if(achievementReady){achievementQueue.push(...fresh);showAchievementToast()}}achievementReady=true;}

function memorySync(){if(state.forgottenMemory?.unlocked)return;const days=new Set(state.journal.entries.filter(e=>e.kind==='acquisitions'&&e.cards?.length).map(e=>e.day));if(days.size<7||state.cards.length<77)return;state.forgottenMemory={unlocked:true,at:new Date().toISOString()};journalAdd('forgotten-memory',{});save();}
function memoryPanel(){const open=!!state.forgottenMemory?.unlocked;return `<section class="curiosity-panel memory-panel"><div class="curiosity-head"><span class="curiosity-icon" aria-hidden="true">${open?'✦':'♧'}</span><div><strong>LE SOUVENIR OUBLIÉ</strong><small>${open?'Les archives se souviennent…':'Une page que le temps a effacée…'}</small></div></div><p>${open?'« Ce que l’on a découvert un jour ne disparaît jamais vraiment. »':'« Il faut laisser le temps écrire plusieurs pages avant que les premières ne retrouvent leur voix. »'}</p><button id="memory-open" ${open&&state.cards.length?'':'disabled'}>${open?'Raviver un souvenir':'Souvenir inaccessible'}</button></section>`;}

function journalDay(){const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
function journalAdd(kind,data){const j=state.journal;const e={id:j.next++,kind,day:journalDay(),at:new Date().toISOString(),note:'',...data};j.entries.push(e);return e}
function journalTCGKey(v){const k=norm(v);return /^(?:one piece|onepiece|optcg|op)(?: tcg| card game)?$/.test(k)?'one piece card game':k}
function migrateJournalTCG(j){if(j.tcgIdentityVersion===1)return;const old=j.seenTCG||[];const hadOld=old.some(v=>journalTCGKey(v)==='one piece card game'&&norm(v)!=='one piece card game');if(hadOld){j.entries=j.entries.filter(e=>!(e.kind==='tcg'&&norm(e.name)==='one piece card game'&&!e.note));}j.seenTCG=[...new Set(old.map(journalTCGKey))];j.tcgIdentityVersion=1;save()}
function journalRenameTCG(o,n){const j=state.journal;if(!j)return;const a=journalTCGKey(o),b=journalTCGKey(n);if(j.seenTCG.includes(a)||state.cards.some(c=>c.tcg===n)){j.seenTCG=[...new Set([...j.seenTCG,b])];}}
function journalInit(){if(state.journal&&Array.isArray(state.journal.entries)&&Number.isInteger(state.journal.next)){migrateJournalTCG(state.journal);return;}state.journal={next:1,entries:[],tcgIdentityVersion:1,seenTCG:[...new Set(state.cards.map(c=>journalTCGKey(c.tcg)))],high:state.cards.length};journalAdd('foundation',{count:state.cards.length,tcgs:distinct(state.cards,'tcg'),earned:achievements.filter(a=>state.achievements.includes(a.id)).length});save()}
function journalAcquisition(c){journalInit();const j=state.journal,day=journalDay();let e=j.entries.find(e=>e.kind==='acquisitions'&&e.day===day);if(!e)e=journalAdd('acquisitions',{cards:[]});e.cards.push({id:c.id,at:new Date().toISOString(),name:c.name,ref:c.ref,tcg:c.tcg,set:c.set,lang:c.lang,type:c.type,boosterChooser:c.boosterChooser||'',origin:c.origin||'',donor:c.donor||''});const k=journalTCGKey(c.tcg);if(k&&!j.seenTCG.includes(k)){j.seenTCG.push(k);journalAdd('tcg',{name:c.tcg})}const n=state.cards.length;for(const m of [33,111,333,666,999,3333])if(j.high<m&&n>=m)journalAdd('milestone',{count:m});j.high=Math.max(j.high,n)}

function validYear(y){return /^\d{4}$/.test(String(y??''))&&+y>=1800&&+y<=9999;}
function timeInit(){if(!Array.isArray(state.yearRules))state.yearRules=[];}
function validMonth(m){return /^(?:[1-9]|0[1-9]|1[0-2])$/.test(String(m??''));}
function monthText(m){return validMonth(m)?new Date(2020,Number(m)-1,1).toLocaleDateString('fr-FR',{month:'long'}):'';}
function setDate(c,long=false){return validYear(c.year)?(validMonth(c.month)?(long?monthText(c.month)+' '+c.year:String(c.month).padStart(2,'0')+'/'+c.year):String(c.year)):'';}
function monthSuggestion(t,s,l){const r=state.yearRules.filter(r=>norm(r.tcg)===norm(t)&&norm(r.set)===norm(s));return r.find(x=>norm(x.lang)===norm(l))?.month||r.find(x=>x.lang==='*')?.month||'';}
function years(C){return [...new Set(C.filter(c=>validYear(c.year)).map(c=>+c.year))].sort((a,b)=>a-b);}
function yearSuggestion(t,s,l){const rules=state.yearRules.filter(r=>norm(r.tcg)===norm(t)&&norm(r.set)===norm(s));return rules.find(r=>norm(r.lang)===norm(l))?.year||rules.find(r=>r.lang==='*')?.year||'';}
function renameTimeRules(k,o,n){for(const r of state.yearRules)if(['tcg','set','lang'].includes(k)&&r[k]===o)r[k]=n;}
function yearCompare(a,b,sort){let x=validYear(a.year),y=validYear(b.year);return x!==y?(x?-1:1):x?((+a.year-+b.year)||((validMonth(a.month)?+a.month:0)-(validMonth(b.month)?+b.month:0)))*(sort==='yearAsc'?1:-1)||a.id-b.id:a.id-b.id;}
function releaseTimeline(cards){
  const byYear=new Map();
  for(const card of cards){
    if(!validYear(card.year))continue;
    const year=Number(card.year),month=validMonth(card.month)?Number(card.month):0;
    if(!byYear.has(year))byYear.set(year,new Map());
    const months=byYear.get(year);
    if(!months.has(month))months.set(month,[]);
    months.get(month).push(card);
  }
  const rows=[...byYear].sort(([a],[b])=>a-b).map(([year,months])=>{
    const dated=[...months].filter(([month])=>month).sort(([a],[b])=>a-b);
    const unknown=months.get(0)||[];
    const total=[...months.values()].reduce((sum,group)=>sum+group.length,0);
    return {year,dated,unknown,total};
  });
  if(!rows.length)return {rows,missing:cards.length};
  const first=rows[0],last=rows.at(-1);
  const oldest=first.dated[0]?.[1][0]||first.unknown[0];
  const newest=last.dated.at(-1)?.[1][0]||last.unknown[0];
  const precise=!first.unknown.length&&!last.unknown.length;
  const monthGap=precise?(last.year-first.year)*12+Number(newest.month)-Number(oldest.month):null;
  return {rows,oldest,newest,monthGap,missing:cards.length-rows.reduce((sum,row)=>sum+row.total,0)};
}
function releaseGap(yearGap,monthGap){
  const years=monthGap===null?yearGap:Math.floor(monthGap/12);
  const months=monthGap===null?0:monthGap%12;
  return [years||monthGap===null?`${years} ${years===1?'an':'ans'}`:'',months||monthGap===0?`${months} mois`:''].filter(Boolean).join(' ');
}
function timeStats(){
  const {rows,oldest,newest,monthGap,missing}=releaseTimeline(state.cards);
  const first=rows[0],last=rows.at(-1);
  const decades=new Set(rows.map(row=>Math.floor(row.year/10))).size;
  const summary=first?`${setDate(oldest,true)} à ${setDate(newest,true)} · ${rows.length} ${rows.length===1?'année':'années'}`:'Aucune année renseignée';
  const breakdown=rows.length?`<div class="time-timeline">${rows.map(({year,dated,unknown,total})=>{
    const id=`time-${year}`;
    const months=dated.map(([month,cards])=>[monthText(month),cards.length]);
    if(unknown.length)months.push(['Mois inconnu',unknown.length]);
    return `<details class="time-year" data-stat-fold="${id}" ${openStatSections.has(id)?'open':''}><summary><span>${year}</span><strong>${total}</strong></summary><ul>${months.map(([label,count])=>`<li><span>${label}</span><strong>${count}</strong></li>`).join('')}</ul>${statButton('year',String(year),`Voir les cartes de ${year}`,total)}</details>`;
  }).join('')}</div>`:'';
  const gap=first?releaseGap(last.year-first.year,monthGap):'—';
  return statFold('time','Les Âges de l’Expédition',summary,`<div class="stat-kpis"><div><strong>${rows.length}</strong><small>${rows.length===1?'Année':'Années'}</small></div><div><strong>${decades}</strong><small>${decades===1?'Décennie':'Décennies'}</small></div><div><strong class="time-gap">${gap}</strong><small>${monthGap===null?'Écart entre les années':'Écart'}</small></div></div>${first?`<p>Plus ancienne : ${esc(oldest.name)} (${setDate(oldest,true)})<br>Plus récente : ${esc(newest.name)} (${setDate(newest,true)})</p>${monthGap===null&&(first.dated.length&&first.unknown.length||last.dated.length&&last.unknown.length)?'<p class="muted">Le mois manque pour certaines cartes aux extrémités de la période.</p>':''}`:''}${breakdown}${missing?statButton('year','unknown','Année inconnue',missing):''}`);
}
function timeCuriosities(C,add){
  const {rows,oldest,newest,monthGap,missing}=releaseTimeline(C);
  if(!rows.length)return;
  add(`Votre collection traverse ${rows.length} ${rows.length===1?'année de sortie différente':'années de sortie différentes'}.`);
  add(`D’après les dates renseignées, la carte la plus ancienne est ${oldest.name} (${setDate(oldest,true)}).`);
  add(`D’après les dates renseignées, la carte la plus récente est ${newest.name} (${setDate(newest,true)}).`);
  if(monthGap>0)add(`Il y a ${releaseGap(0,monthGap)} d’écart entre les sorties les plus anciennes et les plus récentes du Binder 33.`);
  for(const {year,total,dated} of rows){
    add(`${total} ${total===1?'carte de votre collection est sortie':'cartes de votre collection sont sorties'} en ${year}.`);
    for(const [month,cards] of dated)add(`${cards.length} ${cards.length===1?'carte de votre collection est sortie':'cartes de votre collection sont sorties'} en ${monthText(month)} ${year}.`);
  }

 const prior=new Set([...state.cards.filter(c=>!laterIds.has(String(c.id))),...acq.filter(e=>e.day<yesterday).flatMap(e=>e.cards||[])].map(set).filter(Boolean));
 const worlds=new Set(cards.map(tcg).filter(Boolean)).size,sets=new Set(cards.map(set).filter(k=>k&&!prior.has(k))).size;
 const earned=entries.filter(e=>e.kind==='achievement'&&e.day===yesterday).length;
 const donors=new Map();for(const c of cards){const live=state.cards.find(x=>String(x.id)===String(c.id));const origin=c.origin??live?.origin,donor=c.donor??live?.donor;if(origin==='gift'&&donor)donors.set(donor,(donors.get(donor)||0)+1);}
 const el=document.createElement('section');el.className='daily-echo';el.setAttribute('role','region');el.setAttribute('aria-label','Résumé de la veille');
 const n=cards.length,plural=(v,a,b)=>v===1?a:b;
 el.innerHTML='<div class="daily-echo-head"><div><h3>L’Écho de la veille</h3><small>'+esc(d.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'}))+'</small></div><button class="daily-echo-close" aria-label="Fermer">×</button></div><p>'+ (n?'Hier, tu as ajouté <strong>'+n+' '+plural(n,'carte','cartes')+'</strong>, dans <strong>'+worlds+' TCG '+plural(worlds,'différent','différents')+'</strong>.':'<i>L’expédition s’est accordé un jour de repos. De nouvelles terres attendent d’être explorées.</i>')+'</p><div class="daily-echo-extra">'+(sets?'<div>'+sets+' '+plural(sets,'nouveau set exploré','nouveaux sets explorés')+'</div>':'')+(earned?'<div>'+earned+' '+plural(earned,'accomplissements débloqué','accomplissements débloqués')+'</div>':'')+[...donors].map(([name,count])=>'<div>'+esc(name)+' : '+count+' '+plural(count,'carte offerte','cartes offertes')+'</div>').join('')+'</div><button class="daily-echo-go">Poursuivre l’expédition</button>';
 el.querySelectorAll('button').forEach(b=>b.onclick=()=>el.remove());document.body.append(el);
 dailyEcho.last=today;try{localStorage.setItem(storageKey,today);}catch{}
}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')dailyEcho()});

init();</script></body></html>
