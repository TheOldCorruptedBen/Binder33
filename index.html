<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111111"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon.png"><title>Binder 33</title><style>
*{box-sizing:border-box}body{margin:0;background:#111;color:#fff;font:16px system-ui,sans-serif}main{max-width:650px;margin:auto;padding:24px 18px 100px}header{font-size:30px;font-weight:900;letter-spacing:-1px;margin-bottom:24px}em{color:#ef4444;font-style:normal}button,input,select,textarea{font:inherit;color:inherit;background:#222;border:1px solid #444;border-radius:9px;padding:11px}button{cursor:pointer}button:disabled{opacity:.35;cursor:default}button.primary{background:#c62828;border-color:#c62828;font-weight:700}input,textarea,select{width:100%}label{display:block;margin:13px 0 5px;color:#bbb;font-size:14px}.row{display:flex;align-items:center;gap:10px;justify-content:space-between}.muted,small{color:#aaa}h2{margin:0 0 14px}article{border-bottom:1px solid #303030;padding:15px 0;cursor:pointer;display:flex;gap:12px;align-items:center;justify-content:space-between}article div:first-child{min-width:0;flex:1}article small{display:block;margin-top:5px;overflow-wrap:anywhere}nav{position:fixed;bottom:0;left:0;right:0;background:#191919;border-top:1px solid #333;display:flex;justify-content:center;padding:10px 4px calc(10px + env(safe-area-inset-bottom));gap:8px}nav button{background:none;border:0;color:#aaa;font-size:13px;flex:1;max-width:200px}nav button.active{color:#ff5252}dialog{background:#191919;color:white;border:1px solid #444;border-radius:14px;width:min(94%,550px);max-height:90vh;overflow:auto;padding:20px}dialog::backdrop{background:#000b}.choices{display:flex;flex-wrap:wrap;gap:5px;margin:5px 0}.choices button{font-size:13px;padding:7px}.bar{height:7px;background:#333;border-radius:6px;margin:5px 0 12px}.bar i{display:block;background:#e53935;height:100%;border-radius:6px}.section{margin:24px 0} .danger{color:#ff7777} .hidden{display:none} .binder-position{font-size:12px;color:#aaa}nav{top:auto;height:auto;z-index:10} </style></head><body><main><header>BINDER <em>33</em></header><div id="view"></div></main><nav><button data-page="collection">▤ Collection</button><button data-page="stats">▥ Statistiques</button><button data-page="settings">⚙ Paramètres</button></nav><dialog id="editor"></dialog><script>
const fields={ref:'Référence',name:'Nom',rarity:'Rareté',type:'Type / finition',tcg:'TCG',set:'Set',lang:'Langue',notes:'Notes'}, keys=['tcg','set','rarity','type','lang'];let state,page='collection',query='',sort='binder',filters={},currentPage=1,pageSize=Number(localStorage.getItem('binder33-page-size'))||25; if(![25,50,100].includes(pageSize))pageSize=25;const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), norm=s=>String(s??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim(), ordered=a=>[...new Set(a)].sort((a,b)=>a.localeCompare(b,'fr',{numeric:true,sensitivity:'base'}));const save=()=>localStorage.setItem('binder33-v1',JSON.stringify(state));function flags(l){return state.flags[l]||l}function duplicate(c){return state.cards.find(x=>x.id!==c.id&&['tcg','set','ref','lang','type'].every(k=>norm(x[k])===norm(c[k])))}function options(k){return ordered(state.lists[k]||[])}function select(k,v){return `<option value="">Tous</option>`+options(k).map(x=>`<option ${x===v?'selected':''}>${esc(x)}</option>`).join('')}
function render(){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));if(page==='collection'){ $('#view').innerHTML=`<div class="row"><div><small>MA COLLECTION</small><h2>${state.cards.length} cartes</h2></div><button class="primary" id="add">+ Ajouter</button></div><input id="search" placeholder="Nom, référence…" value="${esc(query)}"><div class="row" style="margin:12px 0"><select id="sort" style="width:auto"><option value="binder">Ordre Binder</option>${['name','tcg','ref','rarity','set','lang','type'].map(k=>`<option value="${k}">${fields[k]}</option>`).join('')}</select><button id="filter">Filtres</button></div><div id="filters" class="${Object.values(filters).some(Boolean)?'':'hidden'}">${keys.map(k=>`<label>${fields[k]}</label><select data-filter="${k}">${select(k,filters[k])}</select>`).join('')}</div><div class="row" style="margin:16px 0 4px"><small id="range"></small><select id="pageSize" aria-label="Cartes par page" style="width:auto">${[25,50,100].map(n=>`<option value="${n}">${n} / page</option>`).join('')}</select></div><div id="cards"></div><div id="pagination" class="row" style="margin:20px 0"></div>`;$('#pageSize').value=pageSize;$('#pageSize').onchange=e=>{pageSize=+e.target.value;localStorage.setItem('binder33-page-size',pageSize);currentPage=1;list()};$('#sort').value=sort;$('#sort').onchange=e=>{sort=e.target.value;currentPage=1;list()};$('#search').oninput=e=>{query=e.target.value;currentPage=1;list()};$('#add').onclick=()=>edit();$('#filter').onclick=()=>$('#filters').classList.toggle('hidden');document.querySelectorAll('[data-filter]').forEach(e=>e.onchange=()=>{filters[e.dataset.filter]=e.value;currentPage=1;list()});list()}else if(page==='stats'){let n=state.cards.length;$('#view').innerHTML=`<h2>Statistiques</h2><p>${n} cartes · ${new Set(state.cards.map(c=>c.tcg)).size} TCG</p>`+['tcg','rarity','lang','type','set'].map(k=>{let counts={};state.cards.forEach(c=>counts[c[k]]=(counts[c[k]]||0)+1);return `<section class="section"><h3>${fields[k]}</h3>${Object.entries(counts).sort((a,b)=>b[1]-a[1]).map(([x,v])=>`<div class="row"><span>${esc(k==='lang'?flags(x)+' '+x:x)}</span><span>${v}</span></div><div class="bar"><i style="width:${n?v/n*100:0}%"></i></div>`).join('')}</section>`}).join('')}else settings()}
function list(){let positions=new Map(state.cards.map((c,i)=>[c.id,i+1]));let a=state.cards.filter(c=>[c.name,c.ref,c.set,c.tcg].some(v=>norm(v).includes(norm(query)))&&keys.every(k=>!filters[k]||c[k]===filters[k]));a.sort((a,b)=>sort==='binder'?positions.get(a.id)-positions.get(b.id):String(a[sort]).localeCompare(String(b[sort]),'fr',{numeric:true,sensitivity:'base'})||a.id-b.id);let total=a.length,pages=Math.max(1,Math.ceil(total/pageSize));currentPage=Math.min(Math.max(1,currentPage),pages);let start=(currentPage-1)*pageSize;$('#range').textContent=total?`Cartes ${start+1} à ${Math.min(start+pageSize,total)} sur ${total}`:'0 carte';$('#pagination').innerHTML=pages>1?`<button id="prev" ${currentPage===1?'disabled':''}>‹ Précédent</button><small>Page ${currentPage} / ${pages}</small><button id="next" ${currentPage===pages?'disabled':''}>Suivant ›</button>`:'';function move(delta){currentPage+=delta;list();window.scrollTo({top:0,behavior:'smooth'})}if(pages>1){$('#prev').onclick=()=>move(-1);$('#next').onclick=()=>move(1)}$('#cards').innerHTML=a.slice(start,start+pageSize).map(c=>`<article data-id="${c.id}"><div><strong>${esc(c.name)}</strong><small class="binder-position">#${positions.get(c.id)}</small><small>${esc(c.ref)} · ${esc(c.tcg)} · ${esc(c.set)}</small></div><span class="muted">${esc(c.rarity)}</span><span>${esc(flags(c.lang))}</span><span class="muted">›</span></article>`).join('')||'<p class="muted">Aucune carte.</p>';document.querySelectorAll('article').forEach(e=>e.onclick=()=>edit(state.cards.find(c=>c.id===+e.dataset.id)))}
function edit(c,carry={}){let d=$('#editor');d.innerHTML=`<div class="row"><h2>${c?'Modifier':'Nouvelle carte'}</h2><button id="close">×</button></div><form id="form"><label for="f-position">Position dans le binder</label><input id="f-position" type="number" inputmode="numeric" min="1" max="${state.cards.length+(c?0:1)}" step="1" required value="${c?state.cards.findIndex(y=>y.id===c.id)+1:state.cards.length+1}"><small>Les autres cartes se décalent automatiquement.</small>${['tcg','set','name','ref','rarity','type','lang','notes'].map(k=>`<label for="f-${k}">${fields[k]}</label>${k==='notes'?`<textarea id="f-${k}">${esc(c?.[k]||'')}</textarea>`:`<input id="f-${k}" autocomplete="off" ${k==='name'||k==='ref'?'required':''} value="${esc(c?.[k]??carry[k]??'')}">${keys.includes(k)?`<div class="choices" id="choices-${k}"></div>`:''}`}`).join('')}<p id="error" class="danger"></p><button class="primary" type="submit">Enregistrer</button> ${!c?'<button type="button" id="more">Enregistrer + autre</button>':'<button type="button" class="danger" id="delete">Supprimer</button>'}</form>`;if(!d.open)d.showModal();$('#close').onclick=()=>d.close();keys.forEach(k=>{let input=$('#f-'+k),box=$('#choices-'+k);function suggest(){let v=input.value;box.innerHTML=options(k).filter(x=>norm(x).includes(norm(v))).map(x=>`<button type="button" data-value="${esc(x)}">${esc(x)}</button>`).join('')+(v.trim()&&!options(k).some(x=>norm(x)===norm(v))?`<small>Nouvelle valeur : ${esc(v)}</small>`:'');box.querySelectorAll('button').forEach(b=>b.onclick=()=>{input.value=b.dataset.value;box.innerHTML=''})}input.onfocus=suggest;input.oninput=suggest});function commit(more){let position=Number($('#f-position').value);if(!Number.isInteger(position)||position<1||position>state.cards.length+(c?0:1)){$('#error').textContent='Position invalide.';return}let x={id:c?.id??state.nextId};Object.keys(fields).forEach(k=>x[k]=$('#f-'+k).value.trim());if(!x.name||!x.ref||keys.some(k=>!x[k])){$('#error').textContent='Renseigne tous les champs sauf Notes.';return}keys.forEach(k=>{let old=options(k).find(v=>norm(v)===norm(x[k]));if(old)x[k]=old});let dup=duplicate(x);if(dup){$('#error').textContent='Cette carte est déjà dans ton Binder : '+dup.name;return}keys.forEach(k=>{if(!state.lists[k].includes(x[k]))state.lists[k].push(x[k])});if(c)state.cards=state.cards.filter(y=>y.id!==c.id);else state.nextId++;state.cards.splice(position-1,0,x);state.binderOrderVersion=1;save();render();if(more)edit(null,Object.fromEntries(keys.map(k=>[k,x[k]])));else d.close()}$('#form').onsubmit=e=>{e.preventDefault();commit(false)};if(c)$('#delete').onclick=()=>{if(confirm('Supprimer cette carte ?')){state.cards=state.cards.filter(x=>x.id!==c.id);save();d.close();render()}};else $('#more').onclick=()=>commit(true)}
function settings(){ $('#view').innerHTML=`<h2>Paramètres</h2><button id="export">Exporter la sauvegarde JSON</button><p><label>Restaurer une sauvegarde JSON</label><input type="file" id="import" accept=".json,application/json"></p><h3>Gestion des listes</h3>${keys.map(k=>`<section class="section"><h3>${fields[k]}</h3><select id="old-${k}">${options(k).map(x=>`<option>${esc(x)}</option>`).join('')}</select><label>Nouveau nom ou valeur à fusionner</label><input id="new-${k}" list="dl-${k}"><datalist id="dl-${k}">${options(k).map(x=>`<option value="${esc(x)}">`).join('')}</datalist><div class="row" style="margin-top:8px"><button data-merge="${k}">Renommer / fusionner</button><button data-remove="${k}">Supprimer</button></div>${k==='lang'?'<label>Emoji de la langue sélectionnée</label><input id="flag" placeholder="🇫🇷"><button id="flagSave">Enregistrer emoji</button>':''}</section>`).join('')}`;$('#export').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download='binder33-sauvegarde.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$('#import').onchange=async e=>{try{let s=JSON.parse(await e.target.files[0].text());if(!Array.isArray(s.cards)||!s.lists||!s.flags||!Number.isInteger(s.nextId)||!keys.every(k=>Array.isArray(s.lists[k]))||!s.cards.every(c=>Number.isInteger(c.id)&&Object.keys(fields).every(k=>typeof c[k]==='string')))throw Error();if(confirm('Remplacer la collection actuelle ?')){state=s;normalizeOrder();save();render()}}catch{alert('Sauvegarde invalide.')}};document.querySelectorAll('[data-merge]').forEach(b=>b.onclick=()=>{let k=b.dataset.merge,o=$('#old-'+k).value,n=$('#new-'+k).value.trim();if(!n||!o)return;n=options(k).find(v=>norm(v)===norm(n)&&v!==o)||n;let cards=state.cards.map(c=>c[k]===o?{...c,[k]:n}:c);let seen=new Set();for(let c of cards){let sig=['tcg','set','ref','lang','type'].map(k=>norm(c[k])).join('|');if(seen.has(sig)){alert('Fusion impossible : elle créerait un doublon.');return}seen.add(sig)}if(!confirm('Appliquer à toutes les cartes concernées ?'))return;state.cards=cards;state.lists[k]=ordered(state.lists[k].map(v=>v===o?n:v));if(k==='lang'&&state.flags[o]){state.flags[n]??=state.flags[o];delete state.flags[o]}save();render()});document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{let k=b.dataset.remove,o=$('#old-'+k).value;if(state.cards.some(c=>c[k]===o)){alert('Valeur utilisée : fusionne-la d’abord.');return}state.lists[k]=state.lists[k].filter(x=>x!==o);save();render()});$('#flagSave').onclick=()=>{state.flags[$('#old-lang').value]=$('#flag').value.trim();save();render()}}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{page=b.dataset.page;render()});function normalizeOrder(){if(state.binderOrderVersion!==1){state.cards.sort((a,b)=>a.id-b.id);state.binderOrderVersion=1}}async function init(){try{state=JSON.parse(localStorage.getItem('binder33-v1'));if(!state){let cards=await fetch('cards.json').then(r=>r.json());state={cards,nextId:Math.max(0,...cards.map(c=>c.id))+1,lists:Object.fromEntries(keys.map(k=>[k,ordered(cards.map(c=>c[k]))])),flags:{FR:'🇫🇷',EN:'🇬🇧',JP:'🇯🇵',KO:'🇰🇷'}};save()}normalizeOrder();save();render();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js?v=1.2').catch(console.warn)}catch(e){$('#view').textContent='Impossible de charger la collection. Ouvre l’application depuis son adresse web.'}}init();</script></body></html>
