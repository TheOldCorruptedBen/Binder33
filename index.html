const fields={ref:'Référence',name:'Nom',rarity:'Rareté',type:'Type',tcg:'TCG',publisher:'Éditeur',illustrator:'Illustrateur',set:'Set',lang:'Langue',notes:'Notes'}, keys=['tcg','set','rarity','type','lang','publisher','illustrator'];const optionalCardLists=new Set(['publisher','illustrator']);let state,page='collection',query='',sort='binder',filters={},currentPage=1,pageSize=33;const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), norm=s=>String(s??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim(), ordered=a=>[...new Set(a)].sort((a,b)=>a.localeCompare(b,'fr',{numeric:true,sensitivity:'base'}));const save=()=>localStorage.setItem('binder33-v1',JSON.stringify(state));function defaultFinish(t){let n=norm(t);return n.includes('reverse')?'#529DFF':n.includes('holo')||n.includes('foil')?'#B56CFF':n.includes('altern')?'#EAB54D':n.includes('promo')?'#F58B45':'#A3A3A3'}function finishColor(t){let v=state.finishColors?.[norm(t)];return typeof v==='string'&&/^#[0-9a-f]{6}$/i.test(v)?v:defaultFinish(t)}function finishBadge(t){return `<span class="finish-badge" style="--finish:${finishColor(t)}">${esc(t)}</span>`}function rarityShort(v){return state.rarityAliases?.[v]||v}function flags(l){return state.flags[l]||({FR:'🇫🇷',EN:'🇬🇧',JP:'🇯🇵',JA:'🇯🇵',KO:'🇰🇷',DE:'🇩🇪',ES:'🇪🇸',IT:'🇮🇹',PT:'🇵🇹',ZH:'🇨🇳',CN:'🇨🇳',US:'🇺🇸'}[String(l).toUpperCase()]||l)}function duplicate(c){return state.cards.find(x=>x.id!==c.id&&['tcg','set','ref','lang','type'].every(k=>norm(x[k])===norm(c[k])))}function options(k){return ordered(state.lists[k]||[])}
function setFamilyFor(tcg,set){return (state.setFamilies||[]).find(f=>norm(f.tcg)===norm(tcg)&&f.members.some(n=>norm(n)===norm(set)))}

function syncSetAcronym(tcg,members,abbr){state.setAbbreviations=(state.setAbbreviations||[]).filter(r=>!(norm(r.tcg)===norm(tcg)&&members.some(n=>norm(n)===norm(r.set))));if(abbr)for(const member of members)state.setAbbreviations.push({tcg,set:member,abbr});const f=(state.setFamilies||[]).find(f=>norm(f.tcg)===norm(tcg)&&members.some(n=>f.members.includes(n)));if(f)f.abbr=abbr||''}
function setDisplay(tcg,set){const a=setAbbr(tcg,set);return set+(a?' ['+a+']':'')}

function setFamilySuggestion(tcg,set){const t=norm(tcg),v=norm(set);if(!t||!v)return null;const code=String(set).match(/\b[A-Z]{1,6}[- ]?\d{1,3}\b/i)?.[0]?.replace(/[- ]/g,'').toLowerCase();if(!code)return null;const groups=(state.setFamilies||[]).filter(f=>norm(f.tcg)===t&&[f.name,...f.members,...(state.setAbbreviations||[]).filter(a=>norm(a.tcg)===t&&f.members.includes(a.set)).map(a=>a.abbr)].some(n=>String(n).replace(/[- ]/g,'').toLowerCase()===code));return groups.length===1?groups[0]:null}

function referenceMatch(k,v,term,tcg){return norm(v).includes(norm(term))||(k==='set'&&norm(setAbbr(tcg,v)).includes(norm(term)))||Object.entries(state.referenceAliases?.[k]||{}).some(([alias,target])=>resolveReference(k,target)===v&&norm(alias).includes(norm(term)))}function select(k,v){return `<option value="">Tous</option>`+options(k).map(x=>`<option ${x===v?'selected':''}>${esc(k==='rarity'&&rarityFull(x)!==x?rarityFull(x)+' ('+rarityShort(x)+')':x)}</option>`).join('')}
const cardPalette={Rouge:'#ef4444',Vert:'#22c55e',Bleu:'#3b82f6',Violet:'#9333ea',Noir:'#111111',Orange:'#f97316',Jaune:'#eab308',Blanc:'#FFFFFF',Gris:'#9CA3AF','Bleu pétrole':'#00515A'};const colorNames=['Sans',...Object.keys(cardPalette)];function cardColors(c){return [...new Set(Array.isArray(c?.colors)?c.colors.map(v=>v==='Crème'?'Gris':v).filter(v=>Object.hasOwn(cardPalette,v)):[])].slice(0,2)}function colorSquare(a){if(!a.length)return '<span class="card-color" style="background:#555;border-color:#aaa" title="Sans couleur" aria-label="Sans couleur"></span>';let bg=a.length===2?`linear-gradient(135deg,${cardPalette[a[0]]} 50%,${cardPalette[a[1]]} 50%)`:cardPalette[a[0]];return `<span class="card-color" style="background:${bg}" title="${esc(a.join(' / '))}" aria-label="${esc(a.join(' / '))}"></span>`}function statButton(k,x,label,v,extra=''){return `<button class="stat-link" data-stat-key="${esc(k)}" data-stat-value="${esc(x)}"><span>${label}</span><strong>${v}</strong>${extra}</button>`}
function statIconHourglass(){return `<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="vertical-align:-3px;margin-right:6px"><path d="M5 3h14M5 21h14M7 3v4c0 3 5 5 5 5s5-2 5-5V3M7 21v-4c0-3 5-5 5-5s5 2 5 5v4"/><path d="M10 8h4M10 17h4"/></svg>`;}function statIconStar(){return `<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="vertical-align:-3px;margin-right:6px"><path d="m12 2 2.5 7.5L22 12l-7.5 2.5L12 22l-2.5-7.5L2 12l7.5-2.5Z"/></svg>`;}
const openStatSections=new Set();function statFold(id,title,summary,body){return `<details class="stat-panel stat-fold" data-stat-fold="${id}" ${openStatSections.has(id)?'open':''}><summary><span>${esc(title)}<small>${esc(summary)}</small></span></summary><div>${body}</div></details>`;}
function colorStats(){const counts=Object.fromEntries(colorNames.map(n=>[n,0]));state.cards.forEach(c=>(cardColors(c).length?cardColors(c):['Sans']).forEach(n=>counts[n]++));const total=Object.values(counts).reduce((a,b)=>a+b,0);let offset=0;const seg=colorNames.filter(n=>counts[n]).map(n=>{const start=offset;offset+=100*counts[n]/total;return (cardPalette[n]||'#555')+' '+start+'% '+offset+'%'});const rows=colorNames.filter(n=>counts[n]).sort((a,b)=>counts[b]-counts[a]);return statFold('colors','Couleurs de la collection',rows.filter(n=>n!=='Sans').length+' couleurs représentées','<div class="donut" style="background:'+(seg.length?'conic-gradient('+seg.join(',')+')':'#333')+'"><div><strong>'+total+'</strong><small>attributions</small></div></div>'+rows.map((n,i)=>stats220Row(n==='Sans'?'Sans couleur':n,counts[n],i+1,{filter:'color',value:n,prefix:'<span class="stat-rank-color" style="background:'+(cardPalette[n]||'#555')+'"></span>'})).join('')+'<small>Les cartes multicolores comptent dans chacune de leurs couleurs.</small>');}

function stats220Row(label,n,i,opts={}){const tag=opts.fold?'summary':opts.filter?'button':'div';const attrs=opts.filter?' type="button" data-stat-key="'+esc(opts.filter)+'" data-stat-value="'+esc(opts.value)+'"':'';return '<'+tag+' class="stat-rank"'+attrs+'><span class="stat-rank-index">'+(i==null?'':i+'.')+'</span><span class="stat-rank-main">'+(opts.prefix||'')+esc(label)+(opts.sub?'<small>'+esc(opts.sub)+'</small>':'')+'</span><span class="stat-rank-count">'+n+'</span>'+(opts.fold?'<span class="stat-rank-arrow">⌄</span>':'')+'</'+tag+'>';}
function statGroup(k){if(k==='rarity')return rarityStats();const counts=new Map();for(const c of state.cards){let v=c[k]||'';if(v){if(k==='set')v=setGroupKey(c.tcg,v);counts.set(v,(counts.get(v)||0)+1)}}const rows=[...counts].sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0],'fr'));if(k==='tcg')return '<section class="stat-panel"><h3>'+esc(fields[k])+' <small>'+rows.length+'</small></h3>'+tcgPodium(rows)+(rows.length>3?'<details data-stat-fold="tcg-rest" '+(openStatSections.has('tcg-rest')?'open':'')+'><summary>Voir les autres TCG ('+(rows.length-3)+')</summary>'+rows.slice(3).map(([v,n],i)=>stats220Row(v,n,i+4,{filter:k,value:v})).join('')+'</details>':'')+'</section>';return statFold(k,fields[k],rows.length+' '+(k==='set'?'sets':k==='lang'?'langues':'types'),rows.map(([v,n],i)=>{const card=state.cards.find(c=>k==='set'?setGroupKey(c.tcg,c.set)===v:c[k]===v);const family=(state.setFamilies||[]).find(f=>v===norm(f.tcg)+'|group:'+f.id);return stats220Row(k==='set'?(family?.name||card?.set||v):v,n,i+1,{filter:k,value:v,sub:k==='set'?card?.tcg:'',prefix:k==='lang'?flags(v)+' ':k==='set'?(setAbbr(card?.tcg||'',card?.set||'')?'['+esc(setAbbr(card?.tcg||'',card?.set||''))+'] ':''):k==='type'?'<span class="stat-type-dot" style="background:'+finishColor(v)+'"></span>':''})}).join('')||'<small>Aucune donnée</small>');}

function trioKey(c){return JSON.stringify(['tcg','ref'].map(k=>norm(c[k])))}
function trioRefParts(ref){const m=norm(ref).match(/^([a-z]+)\s+(\d+\s*\/\s*\d+)$/i);return m?{prefix:m[1],number:m[2].replace(/\s/g,'')}:null}
function trioPrefixClose(a,b){if(a===b)return true;if(Math.abs(a.length-b.length)>1)return false;let i=0,j=0,d=0;while(i<a.length&&j<b.length){if(a[i]===b[j]){i++;j++;continue}if(++d>1)return false;if(a.length>b.length)i++;else if(b.length>a.length)j++;else{i++;j++}}return d+(a.length-i)+(b.length-j)<=1}
function matchesTrioGroup(group,c){
  if(norm(group[0].tcg)!==norm(c.tcg))return false;
  if(trioKey(group[0])===trioKey(c))return true;
  const ref=trioRefParts(c.ref);
  return !!ref&&group.every(card=>{
    const other=trioRefParts(card.ref);
    return other&&ref.number===other.number&&trioPrefixClose(ref.prefix,other.prefix);
  });
}
function trioGroups(C,minimum=3){const groups=[];for(const c of C){if(!norm(c.tcg)||!norm(c.ref))continue;const group=groups.find(g=>matchesTrioGroup(g,c));if(group)group.push(c);else groups.push([c])}return groups.filter(g=>g.length>=minimum)}
function cardMatchHint(card){
  if(!['tcg','ref','lang'].every(key=>norm(card[key])))return null;
  const exact=norm(card.type)&&norm(card.set)&&duplicate(card);
  if(exact){
    const {binder,page,slot}=memoryLocation(state.cards.indexOf(exact)+1);
    return {kind:'duplicate',message:'Cette version est déjà dans le Binder',detail:`Classeur ${binder} · page ${page} · emplacement ${slot}`};
  }
  const versions=state.cards.filter(other=>other.id!==card.id&&matchesTrioGroup([other],card));
  if(!versions.length)return null;
  const count=versions.length===1?'1 version déjà dans le Binder':`${versions.length} versions déjà dans le Binder`;
  const message=norm(card.type)&&norm(card.set)?'Nouvelle variante · '+count:count;
  const detail=[...new Set(versions.map(other=>[other.lang,other.type].filter(Boolean).join(' · ')).filter(Boolean))].join(' / ');
  return {kind:'related',message,detail};
}
function bindCardMatchHint(editedCard){

}
function illustratorRows(cards){

  for(const card of cards){
    const key=norm(card.illustrator);
    if(!key)continue;
    if(!byName.has(key))byName.set(key,{name:card.illustrator.trim(),cards:[]});
    byName.get(key).cards.push(card);
  }
  return [...byName.values()].map(row=>({...row,works:trioGroups(row.cards,1)}));
}

function renderSky(){if(!skyLayout)skyLayout=constellationLayout(state.cards);const {w,h,stars}=skyLayout;const selected=stars.find(s=>s.name===constellationSelected);const dust=Array.from({length:180},(_,i)=>`<circle cx="${(i*73.17+13)%w}" cy="${(i*137.13+17)%h}" r="${i%13===0?1:.45}" fill="#d8d9ee" opacity="${.15+(i%7)*.08}"/>`).join('');const links=[];if(stars.length){const used=new Set([0]);while(used.size<stars.length){let best=[0,0,Infinity];for(const i of used)for(let j=0;j<stars.length;j++)if(!used.has(j)){const d=Math.hypot(stars[i].x-stars[j].x,stars[i].y-stars[j].y);if(d<best[2])best=[i,j,d];}used.add(best[1]);links.push(best);}}$('#view').innerHTML=`<button id="sky-back">‹ Statistiques</button><div class="sky-heading"><small>EXPÉDITION 33</small><h2>Le Ciel de l’Expédition</h2><small>${stars.length} ${(stars.length)===1?'monde':'mondes'} · Une seule aventure</small></div><div class="constellation-sky sky-full"><svg viewBox="0 0 ${w} ${h}" role="group" aria-label="Carte céleste des TCG"><defs><radialGradient id="sky-glow"><stop stop-color="#fff3c6" stop-opacity=".75"/><stop offset=".35" stop-color="#e7b65a" stop-opacity=".24"/><stop offset="1" stop-color="#e7b65a" stop-opacity="0"/></radialGradient><radialGradient id="sky-neb"><stop stop-color="#594b82" stop-opacity=".55"/><stop offset="1" stop-color="#17152c" stop-opacity="0"/></radialGradient></defs><ellipse cx="90" cy="${h*.32}" rx="190" ry="${h*.35}" fill="url(#sky-neb)"/><ellipse cx="260" cy="${h*.7}" rx="150" ry="${h*.35}" fill="url(#sky-neb)"/>${dust}<g class="sky-links" stroke="#d1b77b" stroke-width=".65" opacity=".45">${links.map(([i,j])=>`<path d="M${stars[i].x} ${stars[i].y}L${stars[j].x} ${stars[j].y}"/>`).join('')}</g>${stars.map((s,i)=>`<g class="constellation-node" data-star="${esc(s.name)}" role="button" tabindex="0" aria-label="${esc(s.name)} : ${s.n} ${(s.n)===1?'carte':'cartes'}" aria-pressed="${s.name===constellationSelected}">${celestialStar(s,i)}</g>`).join('')}</svg></div><div class // Reflets : une identité dans plusieurs références du même TCG, ou plusieurs univers.
function refletKey(value){return String(value||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim().replace(/\s+/g,' ').toLocaleLowerCase('fr');}
function refletGroups(cards){
 const names=new Map();
 for(const card of cards){const name=refletKey(card.name),tcg=refletKey(card.tcg),ref=refletKey(card.ref);if(!name||!tcg||!ref)continue;
 if(!names.has(name))names.set(name,[]);names.get(name).push(card);}
 const ordinary=[],multiverse=[];
 for(const group of names.values()){
  const byTcg=new Map();
  for(const card of group){const k=refletKey(card.tcg);if(!byTcg.has(k))byTcg.set(k,[]);byTcg.get(k).push(card);}
  for(const tcgCards of byTcg.values()){
   const distinct=[];
   for(const card of tcgCards){const existing=distinct.find(g=>matchesTrioGroup(g,card));if(existing)existing.push(card);else distinct.push([card]);}
   if(distinct.length>=2)ordinary.push(distinct.map(g=>g[0]));
  }
  if(byTcg.size>=2)multiverse.push([...byTcg.values()].flatMap(g=>g));
 }
 return {ordinary,multiverse};
}
function refletStats(){
 const {ordinary,multiverse}=refletGroups(state.cards),total=ordinary.reduce((n,g)=>n+g.length,0);
 const list=(groups,label)=>groups.slice().sort((a,b)=>b.length-a.length||a[0].name.localeCompare(b[0].name,'fr')).map(g=>{
  const positions=g.map(c=>state.cards.indexOf(c)+1).filter(p=>p>0).sort((a,b)=>a-b).map(p=>{const l=memoryLocation(p);return l.binder+'.'+l.page+'.'+l.slot;});
  const tcgs=[...new Set(g.map(c=>c.tcg))].join(' · ');
  const refs=[...new Set(g.map(c=>c.ref))].join(' · ');
  return '<div class="stat-link trio-row trio-layout"><span class="trio-name">'+esc(g[0].name)+'</span><span class="trio-count">'+g.length+' cartes</span><small class="trio-meta">'+esc(tcgs)+' · '+esc(refs)+'</small><span class="trio-positions">'+positions.map(p=>'<span>'+esc(p)+'</span>').join('')+'</span></div>';
 }).join('')||'<small>Aucun '+label+' découvert pour le moment.</small>';
 return statFold('reflets','Les Reflets de l’Expédition',ordinary.length+' '+(ordinary.length===1?'groupe':'groupes')+' · '+multiverse.length+' '+(multiverse.length===1?'multiversel':'multiversels'),
 '<div class="stat-kpis"><div><strong>'+ordinary.length+'</strong><small>Reflets</small></div><div><strong>'+total+'</strong><small>Cartes reflétées</small></div><div><strong>'+multiverse.length+'</strong><small>Multiversels</small></div></div><h4>Reflets</h4>'+list(ordinary,'Reflet')+'<h4>Reflets Multiversels</h4>'+list(multiverse,'Reflet Multiversel'));
}

function renderPagination(pages){

 for(const id of ['pagination-top','pagination']){const el=document.getElementById(id);el.hidden=pages<=1;el.innerHTML=pages<=1?'':`<button type="button" data-page-target="1" aria-label="Première page" ${currentPage===1?'disabled':''}>«</button><button type="button" data-page-target="${currentPage-1}" aria-label="Page précédente" ${currentPage===1?'disabled':''}>‹</button><form class="binder-page-form"><input class="binder-page-number" type="text" inputmode="numeric" enterkeyhint="go" pattern="[0-9]+" aria-label="Numéro de page" value="${currentPage}" style="width:${Math.max(2,String(pages).length)+1}ch"><small>/ ${pages}</small></form><button type="button" data-page-target="${currentPage+1}" aria-label="Page suivante" ${currentPage===pages?'disabled':''}>›</button><button type="button" data-page-target="${pages}" aria-label="Dernière page" ${currentPage===pages?'disabled':''}>»</button>`;if(pages<=1)continue;el.querySelectorAll('button').forEach(b=>b.onclick=()=>go(b.dataset.pageTarget));const form=el.querySelector('form'),input=form.querySelector('input');form.onsubmit=e=>{e.preventDefault();const value=input.value.trim();input.blur();go(value);};input.onfocus=()=>input.select();}
}

function isTournamentBooster(card){

}

    ? `<g transform="translate(0 5) scale(.79)">${icon}</g><path d="M18 1c0 3.3 1.7 5 5 5-3.3 0-5 1.7-5 5 0-3.3-1.7-5-5-5 3.3 0 5-1.7 5-5Z" fill="currentColor" stroke="none"/>`

function reconcileJournal(entries,cards){const ids=new Map(cards.map(c=>[String(c.id),c]));const fields=['name','ref','tcg','set','lang','type'];let removed=0,repaired=0,uncertain=0;const cleaned=entries.map(e=>{if(e.kind!=='acquisitions')return e;return {...e,cards:(e.cards||[]).flatMap(c=>{if(c.id!=null&&ids.has(String(c.id)))return [{...c,id:ids.get(String(c.id)).id}];if(c.id!=null){removed++;return []}const matches=cards.filter(x=>fields.every(k=>norm(x[k]||'')===norm(c[k]||'')));if(matches.length===1){repaired++;return [{...c,id:matches[0].id}]}uncertain++;return [c]})}}).filter(e=>e.kind!=='acquisitions'||e.cards.length||e.note);return {cleaned,removed,repaired,uncertain}}
function auditAchievements(){const old=state.journal.entries;const {cleaned,removed,repaired,uncertain}=reconcileJournal(old,state.cards);let valid;try{state.journal.entries=cleaned;valid=achievements.filter((a,i)=>achievementChecks[i](state.cards)>=a.goal)}finally{state.journal.entries=old}const set=new Set(valid.map(a=>a.id)),lost=achievements.filter(a=>state.achievements.includes(a.id)&&!set.has(a.id)),titles=lost.filter(a=>Object.prototype.hasOwnProperty.call(collectorTitles,a.id));const d=document.createElement('dialog');d.innerHTML=`<h2>Vérification des exploits</h2><p>Exploits valides : ${valid.length}</p><p>Exploits à reverrouiller : ${lost.length}</p><p>Titres concernés : ${titles.length}</p><p>Acquisitions supprimées à retirer du journal : ${removed}</p><p>Anciennes acquisitions à relier : ${repaired}</p><p>Acquisitions incertaines conservées : ${uncertain}</p><p class="muted">Les cartes ne seront pas modifiées. Les acquisitions identifiées de cartes absentes seront retirées du journal. Les anciennes entrées sans identifiant seront reliées si la correspondance est unique, sinon conservées. Les souvenirs scellés restent inchangés.</p><div class="row"><button id="auditCancel">Annuler</button><button id="auditApply" style="background:#15803d;color:white">Appliquer</button></div>`;document.body.append(d);d.addEventListener('close',()=>d.remove());d.querySelector('#auditCancel').onclick=()=>d.close();d.querySelector('#auditApply').onclick=()=>{const names=new Set(lost.map(a=>a.name));state.journal.entries=cleaned.filter(e=>e.kind!=='achievement'||!names.has(e.name));state.achievements=valid.map(a=>a.id);if(!set.has(state.collectorTitle))state.collectorTitle='';achievementQueue=achievementQueue.filter(a=>set.has(a.id));save();d.close();render()};d.showModal()}
function checkAchievements(){const C=state.cards;state.achievements=Array.isArray(state.achievements)?state.achievements:[];let fresh=[];achievements.forEach((a,i)=>{if(!state.achievements.includes(a.id)&&achievementChecks[i](C)>=a.goal){state.achievements.push(a.id);fresh.push(a)}});if(fresh.length){if(state.journal)fresh.forEach(a=>journalAdd("achievement",{name:a.name,secret:a.secret,t:a.t}));save();if(achievementReady){achievementQueue.push(...fresh);showAchievementToast()}}achievementReady=true;}

function memorySync(){if(state.forgottenMemory?.unlocked)return;const days=new Set(state.journal.entries.filter(e=>e.kind==='acquisitions'&&e.cards?.length).map(e=>e.day));if(days.size<7||state.cards.length<77)return;state.forgottenMemory={unlocked:true,at:new Date().toISOString()};journalAdd('forgotten-memory',{});save();}
function memoryPanel(){const open=!!state.forgottenMemory?.unlocked;return `<section class="curiosity-panel memory-panel"><div class="curiosity-head"><span class="curiosity-icon" aria-hidden="true">${open?'✦':'♧'}</span><div><strong>LE SOUVENIR OUBLIÉ</strong><small>${open?'Les archives se souviennent…':'Une page que le temps a effacée…'}</small></div></div><p>${open?'« Ce que l’on a découvert un jour ne disparaît jamais vraiment. »':'« Il faut laisser le temps écrire plusieurs pages avant que les premières ne retrouvent leur voix. »'}</p><button id="memory-open" ${open&&state.cards.length?'':'disabled'}>${open?'Raviver un souvenir':'Souvenir inaccessible'}</button></section>`;}
function showMemory(){if(!state.forgottenMemory?.unlocked||!state.cards.length)return;const orderedCards=[...state.cards].sort((a,b)=>Number(a.id)-Number(b.id));const pool=orderedCards.slice(0,Math.max(1,Math.ceil(orderedCards.length*.75)));const candidates=pool.filter(c=>c.id!==state.forgottenMemory.lastId);const choices=candidates.length?candidates:pool;const c=choices[Math.floor(Math.random()*choices.length)];state.forgottenMemory.lastId=c.id;save();const loc=memoryLocation(state.cards.findIndex(x=>x.id===c.id)+1);const d=$('#memory-dialog');d.innerHTML=`<h2>✦ Le Souvenir oublié ✦</h2><p class="muted" style="text-align:center;font-style:italic">Une page du passé…</p><div class="memory-card"><span class="card-title">${colorSquare(cardColors(c))}<strong>${esc(c.name)}</strong>${finishBadge(c.type)}${c.relic?'<span class="relic-mark">✦</span>':''}</span><small>${esc(c.ref)} · ${esc(c.tcg)} · ${esc(c.set)}</small><small>${esc(rarityFull(c.rarity))} (${esc(rarityShort(c.rarity))}) · ${esc(flags(c.lang))}</small></div><div class="memory-locations">${[['Binder',loc.binder],['Page',loc.page],['Case',loc.slot]].map(([k,v])=>`<div><strong>${v}</strong><small>${k}</small></div>`).join('')}</div><div class="memory-grid" aria-label="Case ${loc.slot} de la page">${Array.from({length:12},(_,i)=>`<span class="${i+1===loc.slot?'chosen':''}">${i+1}</span>`).join('')}</div><button class="memory-close" id="memory-close">Refermer le souvenir</button>`;d.showModal();$('#memory-close').onclick=()=>d.close();}

function journalDay(){const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
function journalAdd(kind,data){const j=state.journal;const e={id:j.next++,kind,day:journalDay(),at:new Date().toISOString(),note:'',...data};j.entries.push(e);return e}
function journalTCGKey(v){const k=norm(v);return /^(?:one piece|onepiece|optcg|op)(?: tcg| card game)?$/.test(k)?'one piece card game':k}
function migrateJournalTCG(j){if(j.tcgIdentityVersion===1)return;const old=j.seenTCG||[];const hadOld=old.some(v=>journalTCGKey(v)==='one piece card game'&&norm(v)!=='one piece card game');if(hadOld){j.entries=j.entries.filter(e=>!(e.kind==='tcg'&&norm(e.name)==='one piece card game'&&!e.note));}j.seenTCG=[...new Set(old.map(journalTCGKey))];j.tcgIdentityVersion=1;save()}
function journalRenameTCG(o,n){const j=state.journal;if(!j)return;const a=journalTCGKey(o),b=journalTCGKey(n);if(j.seenTCG.includes(a)||state.cards.some(c=>c.tcg===n)){j.seenTCG=[...new Set([...j.seenTCG,b])];}}
function journalInit(){if(state.journal&&Array.isArray(state.journal.entries)&&Number.isInteger(state.journal.next)){migrateJournalTCG(state.journal);return;}state.journal={next:1,entries:[],tcgIdentityVersion:1,seenTCG:[...new Set(state.cards.map(c=>journalTCGKey(c.tcg)))],high:state.cards.length};journalAdd('foundation',{count:state.cards.length,tcgs:distinct(state.cards,'tcg'),earned:achievements.filter(a=>state.achievements.includes(a.id)).length});save()}
function journalAcquisition(c){journalInit();const j=state.journal,day=journalDay();let e=j.entries.find(e=>e.kind==='acquisitions'&&e.day===day);if(!e)e=journalAdd('acquisitions',{cards:[]});e.cards.push({id:c.id,at:new Date().toISOString(),name:c.name,ref:c.ref,tcg:c.tcg,set:c.set,lang:c.lang,type:c.type,boosterChooser:c.boosterChooser||'',origin:c.origin||'',donor:c.donor||''});const k=journalTCGKey(c.tcg);if(k&&!j.seenTCG.includes(k)){j.seenTCG.push(k);journalAdd('tcg',{name:c.tcg})}const n=state.cards.length;for(const m of [33,111,333,666,999,3333])if(j.high<m&&n>=m)journalAdd('milestone',{count:m});j.high=Math.max(j.high,n)}

  for(const value of [...saved,...state.cards.map(card=>card.illustrator)]){

function validYear(y){return /^\d{4}$/.test(String(y??''))&&+y>=1800&&+y<=9999;}
function timeInit(){if(!Array.isArray(state.yearRules))state.yearRules=[];}
function validMonth(m){return /^(?:[1-9]|0[1-9]|1[0-2])$/.test(String(m??''));}
function monthText(m){return validMonth(m)?new Date(2020,Number(m)-1,1).toLocaleDateString('fr-FR',{month:'long'}):'';}
function setDate(c,long=false){return validYear(c.year)?(validMonth(c.month)?(long?monthText(c.month)+' '+c.year:String(c.month).padStart(2,'0')+'/'+c.year):String(c.year)):'';}
function monthSuggestion(t,s,l){const r=state.yearRules.filter(r=>norm(r.tcg)===norm(t)&&norm(r.set)===norm(s));return r.find(x=>norm(x.lang)===norm(l))?.month||r.find(x=>x.lang==='*')?.month||'';}
function years(C){return [...new Set(C.filter(c=>validYear(c.year)).map(c=>+c.year))].sort((a,b)=>a-b);}
function yearSuggestion(t,s,l){const rules=state.yearRules.filter(r=>norm(r.tcg)===norm(t)&&norm(r.set)===norm(s));return rules.find(r=>norm(r.lang)===norm(l))?.year||rules.find(r=>r.lang==='*')?.year||'';}
function renameTimeRules(k,o,n){for(const r of state.yearRules)if(['tcg','set','lang'].includes(k)&&r[k]===o)r[k]=n;}
function yearCompare(a,b,sort){let x=validYear(a.year),y=validYear(b.year);return x!==y?(x?-1:1):x?((+a.year-+b.year)||((validMonth(a.month)?+a.month:0)-(validMonth(b.month)?+b.month:0)))*(sort==='yearAsc'?1:-1)||a.id-b.id:a.id-b.id;}
function releaseTimeline(cards){
  const byYear=new Map();
  for(const card of cards){
    if(!validYear(card.year))continue;
    const year=Number(card.year),month=validMonth(card.month)?Number(card.month):0;
    if(!byYear.has(year))byYear.set(year,new Map());
    const months=byYear.get(year);
    if(!months.has(month))months.set(month,[]);
    months.get(month).push(card);
  }
  const rows=[...byYear].sort(([a],[b])=>a-b).map(([year,months])=>{
    const dated=[...months].filter(([month])=>month).sort(([a],[b])=>a-b);
    const unknown=months.get(0)||[];
    const total=[...months.values()].reduce((sum,group)=>sum+group.length,0);
    return {year,dated,unknown,total};
  });
  if(!rows.length)return {rows,missing:cards.length};
  const first=rows[0],last=rows.at(-1);
  const oldest=first.dated[0]?.[1][0]||first.unknown[0];
  const newest=last.dated.at(-1)?.[1][0]||last.unknown[0];
  const precise=!first.unknown.length&&!last.unknown.length;
  const monthGap=precise?(last.year-first.year)*12+Number(newest.month)-Number(oldest.month):null;
  return {rows,oldest,newest,monthGap,missing:cards.length-rows.reduce((sum,row)=>sum+row.total,0)};
}
function releaseGap(yearGap,monthGap){
  const years=monthGap===null?yearGap:Math.floor(monthGap/12);
  const months=monthGap===null?0:monthGap%12;

function rpgNumberedMultiplier(type){
 const match=norm(type).match(/^numerotee?\s*\/\s*([1-9]\d*)$/);
 if(!match)return 1;
 const run=Number(match[1]);
 return run===1?10:run<=5?5:run<=10?4:run<=25?3:run<=50?2:run<=100?1.5:run<=250?1.25:1;

function rpgLanguageFactors(cards){const groups=new Map(),factors=new Map();for(const c of [...cards].sort((a,b)=>Number(a.id)-Number(b.id))){const lang=norm(c.lang),key=JSON.stringify(['tcg','set','ref','type','rarity'].map(k=>norm(c[k])));if(!lang){factors.set(c.id,1);continue}if(!groups.has(key))groups.set(key,new Map());const langs=groups.get(key);if(!langs.has(lang))langs.set(lang,langs.size===0?1:langs.size===1?0.6:0.2);factors.set(c.id,langs.get(lang))}return factors}
function rpgMetrics(){
  const pointsByOrigin=new Map();
  const references=new Set();
  const factors=rpgLanguageFactors(state.cards);
  let referencedCards=0,xp=0,force=state.cards.length;
  for(const c of state.cards){
    const weight=rpgWeight(c);
    if(isTournamentBooster(c))force+=0.25;
    pointsByOrigin.set(c.origin,(pointsByOrigin.get(c.origin)||0)+weight);
    if(norm(c.ref)){
      references.add(trioKey(c));
      referencedCards++;
    }
    xp+=Math.round(10*weight*(factors.get(c.id)??1));
  }
  const intelligence=references.size+(referencedCards-references.size)/10;
  const progress=rpgCharacteristics.map(({name,step,origin})=>{
    if(origin)return (pointsByOrigin.get(origin)||0)/step;
    return (name==='Force'?force:intelligence)/step;
  });
  const classProgress=Math.max(...progress.slice(1));
  const className=rpgCharacteristics[progress.indexOf(classProgress,1)].className;
  xp+=state.rpg?.bonus||0;
  let level=1;
  const threshold=l=>75*(l-1)*(l+2);
  while(xp>=threshold(level+1))level++;
  return {stats:progress.map(x=>1+Math.floor(x)),className,classProgress,xp,level,
    rank:level>=45?'S+':level>=30?'S':level>=22?'A':level>=15?'B':level>=10?'C':level>=6?'D':'E',
    low:threshold(level),high:threshold(level+1)};
}

function systemCallShift(d,n){const x=new Date(d+'T12:00:00Z');x.setUTCDate(x.getUTCDate()+n);return x.toISOString().slice(0,10)}

function rpgWeeklyObjective(period){const seed=[...period].reduce((n,ch)=>((n*33+ch.charCodeAt(0))>>>0),0);const destinations=['collection','stats','journal'];const visits=[0,1].map(i=>{const target=destinations[(seed+i)%destinations.length];return {kind:'visit',target,title:({collection:'Consulter la collection',stats:'Étudier les statistiques',journal:'Relire le Journal'})[target],done:false}});const objectives=[...visits,{kind:'daily',target:2,title:'Accomplir 2 quêtes quotidiennes',done:false},{kind:'quiz',title:'Répondre à une question des archives',done:false},{kind:'cards',target:1,title:'Ajouter 1 nouvelle carte à l’Expédition',done:false,progress:0}];if(seed%2===0){objectives.splice(1,1,{kind:'diversity',target:2,title:'Ajouter des cartes de 2 TCG différents',done:false,progress:0})}if(seed%2===0){const n=4+Math.floor(Math.random()*3);objectives[0]={kind:'calls',target:n,title:'Répondre à l’appel '+n+' fois',done:false,progress:0}}else if(seed%3===0){objectives[0]={kind:'callStreak',target:3,title:'Répondre à l’appel 3 jours consécutifs',done:false,progress:0}}else if(seed%5===0){const n=2+Math.floor(Math.random()*2);objectives[0]={kind:'callCards',target:n,title:'Ajouter une carte le jour d’un appel '+n+' fois',done:false,progress:0}}return {kind:'objectives',period,objectives,baselineIds:state.cards.map(c=>String(c.id)),done:false,rewarded:false,correct:0,index:0,qs:[]}}
function rpgWeeklyDailyCount(q){const r=state.rpg,start=new Date(q.period+'T09:00:00');return new Set([...(r.questArchive||[]).filter(x=>x.type==='daily'&&x.quest?.rewarded&&new Date(x.quest.period+'T12:00:00')>=start).map(x=>x.quest.period),...(r.quests.daily?.rewarded&&new Date(r.quests.daily.period+'T12:00:00')>=start?[r.quests.daily.period]:[])]).size}
function rpgWeeklySync(){const q=state.rpg?.quests?.weekly;if(!q||q.kind!=='objectives'||q.period!==rpgPeriod('weekly')||q.done)return;const r=state.rpg;const start=new Date(q.period+'T09:00:00');const completedDays=new Set([...(r.questArchive||[]).filter(x=>x.type==='daily'&&x.quest?.rewarded&&new Date(x.quest.period+'T12:00:00')>=start).map(x=>x.quest.period),...(r.quests.daily?.rewarded&&new Date(r.quests.daily.period+'T12:00:00')>=start?[r.quests.daily.period]:[])]);for(const o of q.objectives){if(['calls','callStreak','callCards'].includes(o.kind)){o.progress=systemCallProgress(o.kind,q.period);o.done=o.progress>=o.target}if(o.kind==='daily')o.done=completedDays.size>=o.target;if(o.kind==='cards'){const baseline=new Set(q.baselineIds||[]);o.progress=state.cards.filter(c=>!baseline.has(String(c.id))).length;o.done=o.progress>=o.target}if(o.kind==='diversity'){const baseline=new Set(q.baselineIds||[]);o.progress=new Set(state.cards.filter(c=>!baseline.has(String(c.id))).map(c=>String(c.tcg||'').trim()).filter(Boolean)).size;o.done=o.progress>=o.target}}q.correct=q.objectives.filter(o=>o.done).length;q.done=q.correct===q.objectives.length;if(q.done&&!q.rewarded){q.rewarded=true;r.bonus+=90;save();rpgNotice('Quête hebdomadaire accomplie','+90 XP')}else save()}
function rpgMonthlyObjective(period){const seed=[...period].reduce((n,ch)=>((n*31+ch.charCodeAt(0))>>>0),0);const targets=['collection','stats','journal'];const steps=[{kind:'visit',target:targets[seed%3],title:'Reconnaissance des archives'},{kind:'cards',target:1,title:'Retrouver un nouveau fragment'},{kind:'visit',target:targets[(seed+1)%3],title:'Explorer une autre aile des archives'},{kind:'daily',target:2,title:'Honorer deux rendez-vous quotidiens'},{kind:'visit',target:targets[(seed+2)%3],title:'Déchiffrer la dernière salle des archives'}].map(x=>({...x,done:false,progress:0,baselineIds:null}));if(seed%2===0){steps[0]={kind:'callStreak',target:9,title:'Répondre à l’appel 9 jours consécutifs',done:false,progress:0}}else if(seed%3===0){const n=20+Math.floor(Math.random()*6);steps[0]={kind:'calls',target:n,title:'Répondre à l’appel '+n+' fois',done:false,progress:0}}steps[0].baselineIds=state.cards.map(c=>String(c.id));return {kind:'expedition',period,title:'Les Sentiers de l’Expédition',steps,index:0,done:false,rewarded:false,stepRewards:0,qs:[]}}
function rpgMonthlySync(destination){const r=state.rpg,q=r?.quests?.monthly;if(!q||q.kind!=='expedition'||q.period!==rpgPeriod('monthly')||q.done)return;const step=q.steps[q.index];if(!step)return;let completed=false;if(['calls','callStreak'].includes(step.kind)){step.progress=systemCallProgress(step.kind,q.period);completed=step.progress>=step.target}if(step.kind==='visit')completed=destination===step.target;if(step.kind==='cards'){const baseline=new Set(step.baselineIds||[]);step.progress=state.cards.filter(c=>!baseline.has(String(c.id))).length;completed=step.progress>=step.target}if(step.kind==='daily'){const all=[...(r.questArchive||[]).filter(x=>x.type==='daily'&&x.quest?.rewarded).map(x=>x.quest.period),...(r.quests.daily?.rewarded?[r.quests.daily.period]:[])];step.progress=new Set(all.filter(day=>day.slice(0,7)===q.period)).size;completed=step.progress>=step.target}if(!completed)return;step.done=true;step.completedAt=new Date().toISOString();r.bonus+=50;q.stepRewards++;q.index++;if(q.index<q.steps.length){q.steps[q.index].baselineIds=state.cards.map(c=>String(c.id))}else{q.done=true;q.rewarded=true;r.bonus+=150;q.completedAt=new Date().toISOString();r.expeditionTitles??=[];const epithet='Éclaireur des Sentiers';if(!r.expeditionTitles.includes(epithet))r.expeditionTitles.push(epithet);journalAdd('expedition',{title:q.title,period:q.period,completed:true,steps:q.steps.length,xp:q.stepRewards*50+150,epithet})}save();rpgNotice(q.done?'Grande Expédition accomplie':'Étape accomplie',q.done?'Épilogue : les archives reconnaissent votre persévérance. +200 XP':'+50 XP')}
function rpgQuest(k){let period=rpgPeriod(k),old=state.rpg.quests[k];if(old?.period===period)return old;if(k==='daily'){if(old){state.rpg.questArchive??=[];if(!state.rpg.questArchive.some(x=>x.type===k&&x.quest.period===old.period))state.rpg.questArchive.push({type:k,quest:old,archivedAt:new Date().toISOString()})}return state.rpg.quests[k]=rpgDailyObjective(period)}if(k==='monthly'&&(!old||old.kind==='expedition')){if(old){state.rpg.questArchive??=[];if(!state.rpg.questArchive.some(x=>x.type===k&&x.quest.period===old.period)){state.rpg.questArchive.push({type:k,quest:old,archivedAt:new Date().toISOString()});if(old.kind==='expedition'&&!old.done)journalAdd('expedition',{title:old.title,period:old.period,completed:false,steps:old.index,xp:old.stepRewards*50})}}return state.rpg.quests[k]=rpgMonthlyObjective(period)}if(k==='weekly'&&(!old||old.kind==='objectives')){if(old){state.rpg.questArchive??=[];if(!old.done){const ratio=old.objectives.filter(o=>o.done).length/old.objectives.length;old.verdict=ratio>=.7&&ratio<1?"Bravo, mais ça n'est pas assez.":null}if(!state.rpg.questArchive.some(x=>x.type===k&&x.quest.period===old.period))state.rpg.questArchive.push({type:k,quest:old,archivedAt:new Date().toISOString()})}return state.rpg.quests[k]=rpgWeeklyObjective(period)}let q=null;for(let i=0;i<40&&!q;i++)q=rpgQuestion(k);if(!q)return null;let n={daily:1,weekly:3,monthly:5}[k];let qs=[q],seen=new Set([q.text]);for(let tries=0;qs.length<n&&tries<100;tries++){let x=rpgQuestion(k);if(x&&!seen.has(x.text)){qs.push(x);seen.add(x.text)}}if(old){state.rpg.questArchive??=[];if(k==='weekly'&&!old.done){const ratio=old.qs.length?old.correct/old.qs.length:0;old.verdict=ratio>=.7&&ratio<1?"Bravo, mais ça n'est pas assez.":null}if(!state.rpg.questArchive.some(x=>x.type===k&&x.quest.period===old.period))state.rpg.questArchive.push({type:k,quest:old,archivedAt:new Date().toISOString()})}return state.rpg.quests[k]={period,qs,index:0,done:false,correct:0,rewarded:false}}
function rpgSanctionApply(reason){
  const u=state.rpg?.urgent;if(!u)return;
  const targets=['add','stats','journal','player'],target=targets[Math.floor(Math.random()*targets.length)];
  const now=Date.now(),nextNine=new Date(rpgPeriod('daily')+'T09:00:00');nextNine.setDate(nextNine.getDate()+1);const end=reason==='refused'?nextNine.getTime():now+(30+Math.floor(Math.random()*11))*60000;
  u.sanction={target,reason,startedAt:now,until:end};save();
}
function rpgSanctionActive(target){
  const s=state.rpg?.urgent?.sanction;
  return !!s&&s.target===target&&Date.now()<s.until;
}
function rpgSanctionScreen(target){
  const s=state.rpg?.urgent?.sanction;if(!s||!rpgSanctionActive(target))return false;
  const remaining=Math.max(0,s.until-Date.now()),minutes=Math.floor(remaining/60000),seconds=Math.floor((remaining%60000)/1000);
  document.querySelector('#view').innerHTML=`<section class="rpg-panel rpg-emergency" style="text-align:center;padding:32px 16px"><small style="color:#e33">⟐ ${s.reason==='refused'?'DÉSOBÉISSANCE':'ÉCHEC D’ÉPREUVE'}</small><h2 style="color:#e33;font-size:clamp(28px,7vw,54px)">ACCÈS REFUSÉ</h2><p>Le Système a temporairement condamné cet accès.</p><strong id="rpg-sanction-clock">${String(minutes).padStart(2,'0')}:${String(seconds).padStart(2,'0')}</strong><p><small>Les réglages et sauvegardes restent accessibles.</small></p></section>`;
  return true;
}
setInterval(()=>{if(!state?.rpg?.awake||document.hidden)return;rpgSanctionRefresh();const u=state.rpg.urgent;if(u?.status==='scheduled'&&Date.now()>=u.triggerAt||u?.period!==rpgPeriod('daily'))rpgUrgentSync();if(['pending','quiz','passed','failed'].includes(state.rpg.urgent?.status)&&!state.rpg.urgent.resultShown)rpgUrgentPrompt();else rpgNoticeDrain()},1000);
function rpgSanctionRefresh(){const s=state.rpg?.urgent?.sanction;if(!s)return;const clock=document.querySelector('#rpg-sanction-clock');const remaining=Math.max(0,s.until-Date.now());if(!remaining){if(clock)render();return}if(!clock)return;clock.textContent=String(Math.floor(remaining/60000)).padStart(2,'0')+':'+String(Math.floor((remaining%60000)/1000)).padStart(2,'0')}
function rpgUrgentSync(){
  const r=state.rpg;if(!r?.awake)return;
  const period=rpgPeriod('daily'),now=Date.now();
  r.urgentDraws??={};
  // A pending examination must survive a day change, without losing today's independent draw.
  if(r.urgentDraws[period]===undefined){
    const nextNine=new Date(period+'T09:00:00');nextNine.setDate(nextNine.getDate()+1);
    const remaining=nextNine.getTime()-now-60000;
    const selected=remaining>60000&&Math.random()<.09;
    const triggerAt=selected?now+60000+Math.floor(Math.random()*Math.max(1,remaining-60000)):null;
    r.urgentDraws[period]={selected,triggerAt};
    for(const day of Object.keys(r.urgentDraws))if(day<period.slice(0,7)+'-01')delete r.urgentDraws[day];
    save();
  }
  if(r.urgent?.period!==period&&!['pending','quiz'].includes(r.urgent?.status)){
    const previous=r.urgent,draw=r.urgentDraws[period]||{selected:false};
    r.urgent={period,status:draw.selected?'scheduled':'none',triggerAt:draw.triggerAt||null};
    if(previous?.sanction?.until>now)r.urgent.sanction=previous.sanction;
    save();
  }
  const u=r.urgent;
  if(u?.status!=='scheduled'||now<u.triggerAt)return;
  u.status='pending';u.presentedAt=new Date().toISOString();save();
}

function rpgUrgentQuizStart(){
  const u=state.rpg?.urgent;if(!u||u.status!=='pending')return false;
  const questions=[],seen=new Set(),required=3+Math.floor(Math.random()*3);
  for(let i=0;i<180&&questions.length<required;i++){const q=rpgQuestion('urgent');if(q&&!seen.has(q.text)){questions.push(q);seen.add(q.text)}}
  if(questions.length<required){u.status='unavailable';u.resolvedAt=new Date().toISOString();save();rpgNotice('Épreuve indisponible','Les archives ne contiennent pas assez de questions fiables. Aucune sanction.');return false}
  u.status='quiz';u.questions=questions;u.index=0;u.decidedAt=new Date().toISOString();save();return true;
}
function rpgUrgentAnswer(choice){
  const u=state.rpg?.urgent;if(u?.status!=='quiz')return;
  const q=u.questions?.[u.index];if(!q)return;
  if(q.options[choice]!==q.answer){u.status='failed';u.resolvedAt=new Date().toISOString();u.failedQuestion=u.index;rpgSanctionApply('failed');save();rpgUrgentPrompt();return}
  u.index++;
  if(u.index>=u.questions.length){u.status='passed';u.resolvedAt=new Date().toISOString()}
  save();rpgUrgentPrompt();
}
function rpgUrgentPrompt(){

  }else if(u.status==='quiz'){
    const q=u.questions?.[u.index];if(!q){u.status='unavailable';save();return}d.innerHTML=`<small>⟐ ÉPREUVE IRRÉVOCABLE</small><h2>Question ${u.index+1} / ${u.questions.length}</h2><p>${esc(q.text)}</p><div class="rpg-answers">${q.options.map((answer,i)=>`<button data-urgent-answer="${i}">${esc(answer)}</button>`).join('')}</div>`;
  }else{
    const won=u.status==='passed';d.innerHTML=`<small>⟐ VERDICT DU SYSTÈME</small><h2>${won?'ÉPREUVE RÉUSSIE':'ÉCHEC D’ÉPREUVE'}</h2><p>${won?'Les archives reconnaissent votre maîtrise. Aucune récompense en XP.':'Une réponse erronée a interrompu définitivement cette épreuve. Une restriction temporaire a été appliquée.'}</p><button id="urgent-result">Continuer</button>`;
  }
  document.body.append(d);d.addEventListener('cancel',e=>e.preventDefault());d.addEventListener('close',()=>{d.remove();queueMicrotask(()=>{if(['pending','quiz','passed','failed'].includes(state.rpg?.urgent?.status)&&!state.rpg.urgent.resultShown)rpgUrgentPrompt();else rpgNoticeDrain()})});
  if(u.status==='pending'){
    d.querySelector('#urgent-accept').onclick=()=>{const ready=rpgUrgentQuizStart();d.close();if(ready)rpgUrgentPrompt()};
    d.querySelector('#urgent-refuse').onclick=()=>{u.status='refused';u.decidedAt=new Date().toISOString();rpgSanctionApply('refused');save();d.close();rpgNotice('DÉSOBÉISSANCE','Une restriction temporaire a été appliquée jusqu’à 9 h.')};
  }else if(u.status==='quiz')d.querySelectorAll('[data-urgent-answer]').forEach(b=>b.onclick=()=>{const index=Number(b.dataset.urgentAnswer);d.close();rpgUrgentAnswer(index)});
  else d.querySelector('#urgent-result').onclick=()=>{u.resultShown=true;save();d.close()};
