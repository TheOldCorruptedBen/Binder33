function temporalDays(){return [...new Set((state.journal?.entries||[]).filter(e=>e.kind==='acquisitions'&&e.cards?.length).map(e=>e.day).filter(d=>/^\d{4}-\d{2}-\d{2}$/.test(d)))].sort()}
function dayNumber(d){return Date.parse(d+'T00:00:00Z')/86400000}
function temporalAge(){const d=(state.journal?.entries||[]).find(e=>e.kind==='foundation')?.day;return d?Math.max(0,dayNumber(journalDay())-dayNumber(d)):0}
function temporalGap(){const d=temporalDays();return Math.max(0,...d.slice(1).map((v,i)=>dayNumber(v)-dayNumber(d[i])))}
function temporalRun(){const d=temporalDays();let best=0,r=0;d.forEach((v,i)=>{r=i&&dayNumber(v)-dayNumber(d[i-1])===1?r+1:1;best=Math.max(best,r)});return best}

let achievementReady=false,achievementQueue=[];
function checkAchievements(){const C=state.cards;state.achievements=Array.isArray(state.achievements)?state.achievements:[];let fresh=[];achievements.forEach((a,i)=>{if(!state.achievements.includes(a.id)&&achievementChecks[i](C)>=a.goal){state.achievements.push(a.id);fresh.push(a)}});if(fresh.length){if(state.journal)fresh.forEach(a=>journalAdd("achievement",{name:a.name,secret:a.secret,t:a.t}));save();if(achievementReady){achievementQueue.push(...fresh);showAchievementToast()}}achievementReady=true;}
function showAchievementToast(){if(document.querySelector('.achievement-toast')||!achievementQueue.length)return;const a=achievementQueue.shift(),el=document.createElement('div');el.className='achievement-toast'+(a.secret?' secret-reveal':'');el.style.setProperty('--tier',achievementColors[a.t]);el.setAttribute('role','status');el.setAttribute('aria-live','polite');el.innerHTML='<div class="toast-medal" aria-hidden="true"><span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3h8v8a4 4 0 0 1-8 0V3ZM8 5H4v3a4 4 0 0 0 4 4m8-7h4v3a4 4 0 0 1-4 4M12 15v5m-4 1h8"/></svg></span></div><div class="toast-copy"><small>'+ (a.secret?'SUCCÈS SECRET DÉBLOQUÉ':'SUCCÈS DÉBLOQUÉ')+'</small><strong>'+esc(a.name)+'</strong><span>'+esc(achievementTiers[a.t])+'</span></div><div class="toast-timer"></div>';if(collectorTitles[a.id]){const reward=document.createElement('span');reward.className='toast-title-reward';reward.textContent='✦ Titre obtenu : '+collectorTitles[a.id];el.querySelector('.toast-copy').append(reward)}document.body.append(el);setTimeout(()=>{el.classList.add('toast-exit');setTimeout(()=>{el.remove();showAchievementToast()},350)},3300)}
function renderAchievements(){const unlocked=new Set(state.achievements),C=state.cards;const medal='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="6"/><path d="m8 13-2 9 6-3 6 3-2-9"/><path d="m12 4 1.2 2.5 2.8.4-2 2 .5 2.8-2.5-1.3-2.5 1.3.5-2.8-2-2 2.8-.4Z"/></svg>';const lock='<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>';$('#view').innerHTML=`<h2>Succès</h2><div class="achievement-summary"><div><span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3h8v8a4 4 0 0 1-8 0V3ZM8 5H4v3a4 4 0 0 0 4 4m8-7h4v3a4 4 0 0 1-4 4M12 15v5m-4 1h8"/></svg></span><strong>${achievements.filter(a=>unlocked.has(a.id)).length}</strong><small>Débloqués</small></div><div><span><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="15" r="5"/><path d="m8 11-4-8h6l2 5 2-5h6l-4 8"/></svg></span><strong>${achievements.length}</strong><small>Total</small></div><div><span><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3m-4 4v3"/></svg></span><strong>${achievements.filter(a=>a.secret&&unlocked.has(a.id)).length}</strong><small>Secrets débloqués</small></div></div>`+achievementTiers.map((tier,t)=>`<h3 style="color:${achievementColors[t]}">${tier}</h3>`+achievements.map((a,i)=>({a,i})).filter(({a})=>a.t===t).map(({a,i})=>{let done=unlocked.has(a.id),hidden=a.secret&&!done,p=Math.min(a.goal,achievementChecks[i](C));return `<section class="achievement ${done?'earned':''}" style="--tier:${achievementColors[t]}"><span class="achievement-icon">${medal}</span><div><strong>${hidden?'???':esc(a.name)}</strong>${done?`<small class="achievement-tier">${esc(tier.toUpperCase())}</small>`:''}<small class="achievement-description">${hid function journalDay(){const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
function journalAdd(kind,data){const j=state.journal;const e={id:j.next++,kind,day:journalDay(),at:new Date().toISOString(),note:'',...data};j.entries.push(e);return e}
function journalInit(){if(state.journal&&Array.isArray(state.journal.entries)&&Number.isInteger(state.journal.next))return;state.journal={next:1,entries:[],seenTCG:[...new Set(state.cards.map(c=>norm(c.tcg)))],high:state.cards.length};journalAdd('foundation',{count:state.cards.length,tcgs:distinct(state.cards,'tcg'),earned:achievements.filter(a=>state.achievements.includes(a.id)).length});save()}
function journalAcquisition(c){journalInit();const j=state.journal,day=journalDay();let e=j.entries.find(e=>e.kind==='acquisitions'&&e.day===day);if(!e)e=journalAdd('acquisitions',{cards:[]});e.cards.push({id:c.id,at:new Date().toISOString(),name:c.name,ref:c.ref,tcg:c.tcg,set:c.set,lang:c.lang,type:c.type});const k=norm(c.tcg);if(k&&!j.seenTCG.includes(k)){j.seenTCG.push(k);journalAdd('tcg',{name:c.tcg})}const n=state.cards.length;for(const m of [33,111,333,666,999,3333])if(j.high<m&&n>=m)journalAdd('milestone',{count:m});j.high=Math.max(j.high,n)}

g'){title='<svg class="journal-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c5 5 5 13 0 18-5-5-5-13 0-18"/></svg> Nouveau TCG';body=esc(e.name)}else if(e.kind==='milestone'){title='<svg class="journal-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></svg> Une grande étape';body=`${e.count} cartes dans le Binder !`}return `<section class="journal-entry"><div class="journal-date">${esc(fmt(e.day))}</div><h3>${title}</h3><div>${body}</div>${e.note?`<div class="journal-note">${esc(e.note)}</div>`:''}<button data-journal-note="${e.id}">${e.note?'Modifier la note':'+ Ajouter une note'}</button></section>`}).join('');if($('#latest-card'))$('#latest-card').onclick=()=>{const c=state.cards.find(c=>c.id===Number($('#latest-card').dataset.id));if(c)edit(c)};document.querySelectorAll('[data-journal-note]').forEach(b=>b.onclick=()=>{const e=entries.find(e=>e.id===Number(b.dataset.journalNote));const d=$('#editor');d.innerHTML=`<h2>Note du journal</h2><textarea id="journal-note-input" rows="5" placeholder="Un souvenir de cette étape…">${esc(e.note)}</textarea><div class="row"><button id="journal-cancel">Annuler</button><button class="primary" id="journal-save">Enregistrer</button></div>${e.note?'<button class="danger" id="journal-delete">Supprimer la note</button>':''}`;d.showModal();$('#journal-cancel').onclick=()=>d.close();$('#journal-save').onclick=()=>{e.note=$('#journal-note-input').value.trim();save();d.close();renderJournal()};if(e.note)$('#journal-delete').onclick=()=>{e.note='';save();d.close();renderJournal()}})}
